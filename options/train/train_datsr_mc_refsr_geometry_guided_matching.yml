name: finetune_datsr_mc_geometry_soft_valid_percep_edge_extractor_10k_from_baseline
use_tb_logger: true
model_type: RefRestorationModel
map_type: online_CUFED_swap
scale: 4
crop_border: ~
set_CUDA_VISIBLE_DEVICES: ~
gpu_ids: [0]

datasets:
  train:
    name: MCRefSR_geometry_soft_valid_percep_edge_extractor_train
    type: MCRefSRDataset
    dataroot_in: datasets/train/input
    dataroot_gt: datasets/train/gt
    dataroot_ref: datasets/train/ref
    dataroot_depth_metric: datasets/train/depth_metric
    camera_manifest: datasets/mc_camera_manifest.json
    use_albedo: false
    ref_mode: normal
    use_geometry_ref_crop: true
    use_matching_geo_prior: true
    matching_geo_mode: projective_soft_prior
    geometry_depth_type: ray_distance
    # Enable only after train/ref PFMs are confirmed scalar metric depth.
    geometry_use_ref_depth_consistency: false
    geometry_depth_consistency_rel_tol: 0.05
    geometry_depth_consistency_abs_tol: 0.10
    geometry_min_overlap: 0.60
    geometry_max_attempts: 20
    geometry_fallback_grid_stride: 4
    geometry_sample_stride: 4
    geometry_ref_margin: 1.2
    geometry_ref_min_scale: 0.5
    geometry_ref_max_scale: 4.0
    geometry_projection_trim_percentile: 1.0
    geometry_min_crop_coverage: 0.90
    geometry_fail_policy: error
    geometry_strict_pairs: true
    io_backend:
      type: disk
    gt_size: 160
    # Camera projection is expressed in the original image orientation.
    use_flip: false
    use_rot: false
    sample_enlarge_ratio: 300
    lq_noise_aug: true
    lq_noise_aug_sigma_max: !!float 3.92e-3
    use_shuffle: true
    n_workers: 8
    batch_size: 4
    dataset_enlarge_ratio: 1

  val:
    name: MCRefSR_geometry_soft_valid_percep_edge_extractor_val
    type: MCRefSRDataset
    dataroot_in: datasets/test/input
    dataroot_gt: datasets/test/gt
    dataroot_ref: datasets/test/ref
    dataroot_depth_metric: datasets/test/depth_metric
    camera_manifest: datasets/mc_camera_manifest.json
    use_albedo: false
    ref_mode: normal
    use_geometry_ref_crop: false
    use_matching_geo_prior: true
    matching_geo_mode: projective_soft_prior
    geometry_depth_type: ray_distance
    geometry_use_ref_depth_consistency: false
    geometry_depth_consistency_rel_tol: 0.05
    geometry_depth_consistency_abs_tol: 0.10
    geometry_strict_pairs: true
    io_backend:
      type: disk
    window_size: 8

network_g:
  type: NewSwinUnetv3RestorationNet
  ngf: 128
  n_blocks: 8
  groups: 8
  embed_dim: 128
  depths: [4, 4]
  num_heads: [4, 4]
  window_size: 8
  use_checkpoint: true
  K: 1
  use_aux_albedo: false
  use_wavelet_ll_matching: false
  use_feature_wavelet_matching: false
  use_ref_hf_residual: false
  use_similarity_gate: false
  legacy_wav_concat: false

network_map:
  type: FlowSimCorrespondenceGenerationArch
  patch_size: 3
  stride: 1
  vgg_layer_list: ['relu1_1', 'relu2_1', 'relu3_1']
  vgg_type: vgg19
  use_matching_geo_prior: true
  matching_geo_mode: projective_soft_prior
  # All Ref patches remain candidates; geometry changes their matching score.
  geometry_soft_prior_strength: 1.0
  geometry_soft_prior_sigma: 0.1
  geometry_confidence_mode: valid_mask
  geometry_depth_edge_scale: 0.5
  geometry_depth_edge_floor: 0.1
  geometry_auxiliary_logit_scale: 10.0
  geometry_auxiliary_max_queries: 512
  normalize_similarity: false

network_extractor:
  type: ContrasExtractorSep

path:
  # Start from the same 40k generator and original DATSR extractor. Geometry
  # matching/projection losses below fine-tune and save the extractor again.
  pretrain_model_g: experiments/train/train_datsr_mc_refsr_baseline/models/net_g_40000.pth
  pretrain_model_d: ~
  pretrain_model_feature_extractor: experiments/pretrained_model/feature_extraction.pth
  pretrain_model_wavelet: ~
  strict_load: false
  resume_state: ~
  root: experiments/train/

train:
  # Match the effective learning-rate scale at the end of baseline training.
  lr_g: !!float 1.25e-5
  lr_offset: !!float 1.25e-5
  lr_relu2_offset: !!float 1.25e-6
  lr_relu3_offset: !!float 1.25e-7
  lr_feature_extractor: !!float 1e-6
  freeze_feature_extractor: false
  weight_decay_g: 0
  beta_g: [0.9, 0.999]
  lr_d: !!float 1e-4
  weight_decay_d: 0
  beta_d: [0.9, 0.999]
  lr_scheme: MultiStepLR
  niter: 10000
  warmup_iter: -1
  net_g_pretrain_steps: 0
  lr_steps: [6000, 8500, 9500]
  lr_gamma: 0.5
  pixel_criterion: L1Loss
  pixel_weight: !!float 1.0
  perceptual_opt:
    layer_weights:
      'relu2_1': 0.1
      'relu3_1': 1.0
      'relu4_1': 1.0
    vgg_type: vgg19
    use_input_norm: true
    perceptual_weight: !!float 5e-4
    style_weight: 0
    norm_img: false
    criterion: l1
  edge_opt:
    type: EdgeLoss
    loss_weight: !!float 1e-1
    criterion: l1
  # Restore differentiable geometry supervision so net_extractor is optimized
  # and saved as net_extractor_*.pth together with net_g.
  matching_loss_weight: !!float 1e-3
  projection_loss_weight: !!float 1e-2
  manual_seed: 10
  net_d_steps: 1
  net_d_init_steps: 0

val:
  val_freq: !!float 5e3
  save_img: true
  calculate_lpips: true
  lpips_net: alex

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3

dist_params:
  backend: nccl
  port: 29746
