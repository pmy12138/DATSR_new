# Test WTRN-style feature-domain wavelet matching and HF transfer.
name: test_datsr_wtrn_feature_wavelet_noisy
model_type: RefRestorationModel
scale: 4
crop_border: ~
num_gpu: 1

datasets:
  test:
    name: CUFED5_sigma50
    type: NoisyRefCUFEDDataset
    dataroot_in: ./datasets/CUFED5_sigma50
    dataroot_ref: ./datasets/CUFED5
    dataroot_gt: ./datasets/CUFED5
    io_backend:
      type: disk
    ann_file: ./datasets/CUFED5_pairs.txt
    scale: 4

network_g:
  type: NewSwinUnetv3RestorationNet
  ngf: 128
  n_blocks: 8
  groups: 8
  embed_dim: 128
  depths: [4, 4]
  num_heads: [4, 4]
  window_size: 8
  use_checkpoint: true
  wav_channels: 64
  K: 1
  use_wavelet_ll_matching: true
  use_feature_wavelet_matching: true
  use_ref_hf_residual: true
  use_similarity_gate: true
  zero_init_ref_hf: false
  init_ref_hf_scale: 0.02
  max_ref_hf_scale: 0.05
  legacy_wav_concat: false

network_map:
  type: FlowSimCorrespondenceGenerationArch
  patch_size: 3
  stride: 1
  vgg_layer_list: ['relu1_1', 'relu2_1', 'relu3_1']
  vgg_type: 'vgg19'

network_extractor:
  type: ContrasExtractorSep

network_wavelet:
  type: WaveletVGGFrequencyBranch
  out_channels: 64

path:
  pretrain_model_g: experiments/train/train_datsr_wtrn_feature_wavelet_noisy/models/net_g_latest.pth
  pretrain_model_d: ~
  pretrain_model_feature_extractor: experiments/pretrained_model/feature_extraction.pth
  pretrain_model_wavelet: experiments/train/train_datsr_wtrn_feature_wavelet_noisy/models/net_wavelet_latest.pth
  strict_load: false
  root: experiments/test/wtrn_feature_wavelet
  visualization: experiments/test/wtrn_feature_wavelet/visualization

val:
  save_img: true
  collect_hf_stats: true

suffix: ~
